<!doctype html><html><head><meta charset="utf-8"><title>MEDUSA</title>
<style>body{background:#111;color:#ddd;font:13px system-ui;margin:12px}#v{position:relative;overflow:auto;border:1px solid #444;height:80vh}
#v img{position:absolute;left:0;top:0;image-rendering:pixelated}label{margin-right:10px}</style></head><body>
<b>MEDUSA</b> - 80 columns x 18 rows x 2 layers, 6 spawns,
13 block types (rendered columns as in the preview PNGs).<br>
<label><input type="checkbox" checked onchange="tog('l0',this)"> layer 0</label> <label><input type="checkbox" checked onchange="tog('l1',this)"> layer 1</label> <label><input type="checkbox" onchange="tog('ov',this)"> collision + spawns</label>
<div id="v"><img src="preview_composite.png" style="z-index:0;opacity:0"><img id="l0" src="preview_layer0.png" style="z-index:10"><img id="l1" src="preview_layer1.png" style="z-index:9"><img id="ov" src="preview_collision.png" style="z-index:50;display:none"></div>

<p>Models (T28): <br><img src="models.png" style="max-width:100%">
<script>function tog(id,cb){document.getElementById(id).style.display=cb.checked?'block':'none'}</script></body></html>
