[display]
mode = borderless      ; borderless | windowed | exclusive (exclusive = original SetDisplayMode path, debugging only)
monitor = primary      ; primary | 1 | 2 ...
scale = integer        ; integer (9x on 4K) | fit (largest 4:3, may be non-integer) | stretch (fill 16:9, distorts)
filter = nearest       ; nearest | linear
aspect = 4:3           ; 4:3 | 16:9 (16:9 only with scale = stretch)
border_color = 000000
window_scale = 3       ; windowed mode only: client = 320*N x 240*N
vsync = on
fps_cap = 0            ; 0 = game's own 30 Hz clock. Never change game timing here.
dpi_aware = on         ; process is per-monitor DPI aware, so Windows doesn't bitmap-stretch the window
hide_cursor = on
log = off              ; on -> working/game/hercules_display.log
renderer = gpu         ; gdi (original 8-bit frame, scaled) | gpu (D3D11: primitives redrawn at the output scale)
dev = off              ; gpu only: overlay with frame, module, hero state/frame/position, last file, pivot cross
art_dir = art          ; gpu only: replacement art folder next to HERCULES.EXE (<key>_<w>x<h>.png, 8-bit indexed, k x size)
art_families = sprite,level,ui,screen,smooth ; gpu only: replacement families to load (subfolders of art_dir); F11 in game toggles art on/off
art_dump = off         ; gpu only: on -> write every new texture block once to <art_dir>/dump/ (catalog for replacement art)
